apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-idp-vibe-app-2
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: nginx-idp-vibe-app-2 }
  template:
    metadata:
      labels: { app: nginx-idp-vibe-app-2 }
    spec:
      containers:
        - name: nginx-idp-vibe-app-2
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
